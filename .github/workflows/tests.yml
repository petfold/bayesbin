name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["test", "test,fast"]  # the NumPy path, and with the numba kernels
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest  # the tests against the C++ program skip: it is not built here
