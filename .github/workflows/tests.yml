name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["test", "test,fast"]  # the NumPy path, and with the numba kernels
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[${{ matrix.extras }}]"
      - name: Build cpp/binsdfc-fb (the tests against it skip without it)
        working-directory: cpp/binsdfc-fb
        run: |
          g++ -O2 -fopenmp -ffast-math -c vmath.cpp -o vmath.o
          g++ -O2 -fopenmp -fno-math-errno -std=c++14 -o binsdfc binsdfc.cpp evidencecomputer.cpp \
              logadd.cpp simplexminimiser.cpp spikecounter.cpp spikedensityfunction.cpp \
              forwardbackward.cpp vmath.o
          test -x binsdfc
      - run: pytest -rs  # -rs: list any skipped test and why
